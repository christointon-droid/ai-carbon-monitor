<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Carbon Monitor: trial prototype</title>
<style>
:root{--bg:#F2F6F6;--ink:#10232B;--mut:#4B6068;--line:#D5E0E2;--card:#fff;--pri:#0B5D5E;--pri2:#E3F1F0;--a1:#10232B;--a2:#0B7F80;--a3:#7CC4BE;--a4:#C9A25A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 8px;line-height:1.2}
h1{font-size:32px}h2{font-size:21px}h3{font-size:17px}
a{color:var(--pri)}
.note{background:#FFF4DB;color:#4A3A10;padding:8px 20px;font-size:14px;text-align:center}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.logo{font:700 20px Georgia,serif;color:var(--pri);text-decoration:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
nav a.on{background:var(--pri2);color:var(--pri)}
.strip{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mut)}
.strip b{font:700 22px Georgia,serif;color:var(--pri)}
main{max-width:1160px;margin:0 auto;padding:28px 24px 60px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.l{flex:1 1 560px;min-width:0}.r{flex:0 1 340px;min-width:280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.mut{color:var(--mut);font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:8px}
.cat{display:flex;flex-direction:column;gap:6px}
.cat ul{margin:0 0 8px;padding-left:18px;font-size:14px;flex:1}
.tag{align-self:flex-start;font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;background:#E6ECEC;color:var(--mut)}
.tag.live{background:var(--pri);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;font:600 15px system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.s{background:#fff;color:var(--pri)}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,nav a:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input[type=number]{width:100%;min-height:44px;border:1px solid #7E9197;border-radius:8px;padding:0 12px;font:inherit}
input[type=range]{width:100%;accent-color:var(--pri)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.big{font:700 54px/1 Georgia,serif;color:var(--pri)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #E7EEEF}
.bar{height:10px;border-radius:5px;background:#E6ECEC;overflow:hidden;margin:2px 0 8px}.bar i{display:block;height:100%}
.ck{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E7EEEF}
.ck input{width:22px;height:22px;accent-color:var(--pri)}.ck label{flex:1;margin:0;font-size:16px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
@media print{.note,header,.acts,footer{display:none}body{background:#fff}.card{border:0}}
</style></head><body>
<div class="note">Trial prototype. Emission factors are illustrative and offset partners are placeholders. Do not use for official reporting.</div>
<header><a class="logo" href="#home">AI Carbon Monitor</a><nav id="nav"></nav>
<div class="strip">Your footprint <b id="tot">0.0</b> tCO₂e</div></header>
<main id="app"></main>
<footer>Prototype for feedback. Figures are saved only in your own browser.</footer>
<script>
var F={ice:.170,hyb:.115,ev:.045,sh:.151,lh:.148,rl:.035,car:.170,ho:11};
var D={c:{emp:200,weeks:46,ev:15,hyb:25,km:15,days:4},t:{sh:120,shk:1600,lh:25,lhk:11000,rl:300,rlk:400,hc:8000,ov:20000,ho:600},inc:{c:1,t:1}};
var S=load();
function load(){try{var s=JSON.parse(localStorage.getItem("acm1"));if(s&&s.c&&s.t&&s.inc)return s}catch(e){}return JSON.parse(JSON.stringify(D))}
function save(){try{localStorage.setItem("acm1",JSON.stringify(S))}catch(e){}}
function commute(){var c=S.c,ice=Math.max(0,100-c.ev-c.hyb),p=2*c.km*c.days*c.weeks*c.emp/100;
 return[["Petrol / diesel",p*ice*F.ice/1000,"#10232B"],["Hybrid",p*c.hyb*F.hyb/1000,"#0B7F80"],["Electric",p*c.ev*F.ev/1000,"#7CC4BE"]]}
function travel(){var t=S.t;return[["Long-haul flights",t.lh*t.lhk*F.lh/1000,"#10232B"],["Short-haul flights",t.sh*t.shk*F.sh/1000,"#0B7F80"],["Hotel stays",t.ho*F.ho/1000,"#7CC4BE"],["Rail",t.rl*t.rlk*F.rl/1000,"#C9A25A"],["Own vehicle",t.ov*F.car/1000,"#6F8790"],["Hire cars and taxis",t.hc*F.car/1000,"#B8CACD"]]}
function sum(a){return a.reduce(function(s,x){return s+x[1]},0)}
function f1(n){return n.toFixed(1)}
function total(){return(S.inc.c?sum(commute()):0)+(S.inc.t?sum(travel()):0)}
function bars(a){var s=sum(a)||1;return a.map(function(x){var p=x[1]/s*100;return'<div class="kv"><span>'+x[0]+'</span><b>'+f1(x[1])+' t ('+Math.round(p)+'%)</b></div><div class="bar"><i style="width:'+p+'%;background:'+x[2]+'"></i></div>'}).join("")}
function num(g,k,l){return'<div><label for="'+g+k+'">'+l+'</label><input id="'+g+k+'" type="number" min="0" value="'+S[g][k]+'" data-g="'+g+'" data-k="'+k+'"></div>'}
function sl(k,l){return'<div><label for="c'+k+'">'+l+': <span id="o'+k+'"></span></label><input id="c'+k+'" type="range" min="0" max="100" value="'+S.c[k]+'" data-g="c" data-k="'+k+'"></div>'}
var CATS=[["Upstream",[["Purchased goods and services",["Raw materials","Office supplies","IT, software and cloud","Professional services"]],["Capital goods",["Machinery","Buildings and fit-out","Fleet purchases","IT hardware"]],["Fuel and energy related",["Upstream fuel","Grid transmission losses"]],["Upstream transport and distribution",["Inbound freight","Warehousing","Courier and parcels"]],["Waste from operations",["Landfill","Recycling","Incineration","Wastewater"]],["Business travel",["Flights","Rail","Hire cars and taxis","Own-vehicle mileage","Hotel stays"],"t"],["Employee commuting",["Car: EV, hybrid, petrol or diesel","Bus and rail","Cycling and walking","Working from home"],"c"],["Upstream leased assets",["Leased buildings","Leased vehicles","Leased equipment"]]]],
["Downstream",[["Downstream transport",["Delivery to customers","Retail storage","Last mile"]],["Processing of sold products",["Intermediate products","Contract manufacturing"]],["Use of sold products",["Direct use-phase energy","Indirect use-phase","Fuels sold"]],["End of life of sold products",["Disposal","Recycling","Packaging"]],["Downstream leased assets",["Property let to tenants","Equipment leased out"]],["Franchises",["Franchise operations","Franchise energy use"]],["Investments",["Equity","Debt","Project finance"]]]]];
function home(){var n=0,h='<div class="cols"><div class="l"><h1>Your Scope 3 inventory</h1><p class="mut">Pick a category, add an estimate, then build your report. Two categories work in this trial.</p>';
 CATS.forEach(function(sec){h+='<h2 style="margin-top:24px">'+sec[0]+'</h2><div class="g">';sec[1].forEach(function(c){n++;var live=c[2],r=live==="t"?"#travel":"#commute";
  h+='<div class="card cat"><span class="mut">Category '+n+'</span><h3>'+c[0]+'</h3><span class="tag'+(live?" live":"")+'">'+(live?"Estimator ready":"Coming soon")+'</span><ul>'+c[1].map(function(i){return"<li>"+i+"</li>"}).join("")+'</ul>'+(live?'<a class="btn" href="'+r+'">Open estimator</a>':'<button class="btn s" disabled>Coming soon</button>')+'</div>'});h+='</div>'});
 return h+'</div><div class="r"><div class="card"><h2>Your report</h2><div class="big">'+f1(total())+'</div><p class="mut">tCO₂e, '+(S.inc.c+S.inc.t)+' of 15 categories included</p>'+(S.inc.t?'<div class="kv"><span>Business travel</span><b>'+f1(sum(travel()))+' t</b></div>':"")+(S.inc.c?'<div class="kv"><span>Employee commuting</span><b>'+f1(sum(commute()))+' t</b></div>':"")+'<div class="acts"><a class="btn" href="#report">Build report</a><a class="btn s" href="#offset">Offset with partners</a></div></div></div></div>'}
function commutePg(){return'<div class="cols"><div class="l card"><h1>Employee commuting</h1><p class="mut">Category 7. Enter estimates; refine with survey data later.</p><h2>Workforce</h2><div class="f">'+num("c","emp","Employees commuting")+num("c","weeks","Working weeks per year")+'</div><h2>Vehicle mix</h2><div class="f">'+sl("ev","Electric")+sl("hyb","Hybrid")+'<div><label>Petrol / diesel: <span id="oice"></span></label><p class="mut" style="margin:0">The remainder.</p></div></div><h2>Commute pattern</h2><div class="f">'+num("c","km","Average one-way distance (km)")+num("c","days","Commuting days per week")+'</div><div class="acts"><a class="btn" href="#report">Add to report</a><a class="btn s" href="#home">Back to home</a></div></div><div class="r card"><h2>Your estimate</h2><div class="big" id="rs"></div><p class="mut">tCO₂e per year</p><div id="rb"></div><p class="mut">Employees × round-trip km × days × weeks × emission factor. Illustrative factors.</p></div></div>'}
function travelPg(){return'<div class="cols"><div class="l card"><h1>Business travel</h1><p class="mut">Category 6. Enter annual totals by mode.</p><h2>Flights</h2><div class="f">'+num("t","sh","Short-haul return trips")+num("t","shk","Avg round-trip km")+num("t","lh","Long-haul return trips")+num("t","lhk","Avg round-trip km")+'</div><h2>Rail</h2><div class="f">'+num("t","rl","Trips")+num("t","rlk","Avg km per trip")+'</div><h2>Road and hotels</h2><div class="f">'+num("t","hc","Hire car and taxi km")+num("t","ov","Own vehicle km")+num("t","ho","Hotel nights")+'</div><div class="acts"><a class="btn" href="#report">Add to report</a><a class="btn s" href="#home">Back to home</a></div></div><div class="r card"><h2>Your estimate</h2><div class="big" id="rs"></div><p class="mut">tCO₂e per year</p><div id="rb"></div><p class="mut">Distance × emission factor per mode. Illustrative factors.</p></div></div>'}
function reportPg(){var all=[];if(S.inc.c)all.push(["Employee commuting",sum(commute()),"#0B7F80"]);if(S.inc.t)all.push(["Business travel",sum(travel()),"#C9A25A"]);
 return'<div class="cols"><div class="l card"><h1>Scope 3 report</h1><p class="mut">Choose what to include. Print this page to save it as a PDF.</p><div class="ck"><input type="checkbox" id="ik" data-i="c"'+(S.inc.c?" checked":"")+'><label for="ik">Category 7: Employee commuting<br><span class="mut">'+f1(sum(commute()))+' t, estimate</span></label></div><div class="ck"><input type="checkbox" id="it" data-i="t"'+(S.inc.t?" checked":"")+'><label for="it">Category 6: Business travel<br><span class="mut">'+f1(sum(travel()))+' t, estimate</span></label></div><p class="mut">13 other categories are coming soon.</p><div class="acts"><button class="btn" onclick="window.print()">Save as PDF</button><a class="btn s" href="#home">Add more categories</a></div></div><div class="r card"><h2>Report summary</h2><div class="big">'+f1(total())+'</div><p class="mut">tCO₂e, '+(S.inc.c+S.inc.t)+' of 15 categories</p>'+(all.length?bars(all):'<p class="mut">Tick a category to include it.</p>')+'<div class="acts"><a class="btn" href="#offset">Offset with partners</a></div></div></div>'}
function offsetPg(){var t=f1(total());var P=[["Reforestation","[PARTNER NAME A]"],["Renewable energy","[PARTNER NAME B]"],["Carbon removal","[PARTNER NAME C]"]];
 return'<h1>Offset your footprint</h1><p class="mut" style="max-width:640px">Reduce what you can first, then offset the rest. You will pay the partner directly on their site. Partners shown here are placeholders.</p><div class="card" style="margin:18px 0"><span class="mut">To offset</span><div class="big">'+t+' t</div></div><div class="g">'+P.map(function(p){return'<div class="card cat"><span class="mut">'+p[0]+', [CERTIFICATION STANDARD]</span><h3>'+p[1]+'</h3><p class="mut">[Short project description]</p><b>£[PRICE] per tCO₂e</b><button class="btn s" disabled>Visit partner site</button></div>'}).join("")+'</div>'}
var PG={home:home,commute:commutePg,travel:travelPg,report:reportPg,offset:offsetPg};
function route(){var r=(location.hash||"#home").slice(1);if(!PG[r])r="home";document.getElementById("app").innerHTML=PG[r]();
 document.getElementById("nav").innerHTML=[["home","Home"],["commute","Commuting"],["travel","Business travel"],["report","Report"],["offset","Offset"]].map(function(n){return'<a href="#'+n[0]+'"'+(n[0]===r?' class="on" aria-current="page"':"")+'>'+n[1]+'</a>'}).join("");upd();window.scrollTo(0,0)}
function upd(){var r=(location.hash||"#home").slice(1),a=r==="commute"?commute():r==="travel"?travel():null;
 if(a){document.getElementById("rs").textContent=f1(sum(a));document.getElementById("rb").innerHTML=bars(a)}
 if(r==="commute"){document.getElementById("oev").textContent=S.c.ev+"%";document.getElementById("ohyb").textContent=S.c.hyb+"%";document.getElementById("oice").textContent=Math.max(0,100-S.c.ev-S.c.hyb)+"%"}
 document.getElementById("tot").textContent=f1(total())}
document.addEventListener("input",function(e){var d=e.target.dataset;if(d.k){var v=Math.max(0,+e.target.value||0);S[d.g][d.k]=v;if(d.g==="c"&&(d.k==="ev"||d.k==="hyb")){var o=d.k==="ev"?"hyb":"ev";if(S.c.ev+S.c.hyb>100){S.c[o]=100-v;var el=document.getElementById("c"+o);if(el)el.value=S.c[o]}}save();upd()}});
document.addEventListener("change",function(e){var i=e.target.dataset.i;if(i){S.inc[i]=e.target.checked?1:0;save();route()}});
window.addEventListener("hashchange",route);route();
</script></body></html>
